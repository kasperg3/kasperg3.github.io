<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The mark: a K in the aurora colours over the same dark ground as the
       featured tile. Teal to amber to rose, bottom-left to top-right, like the
       lights across the top of the front page. -->
  <defs>
    <linearGradient id="aurora" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3fbeb2"/>
      <stop offset=".55" stop-color="#f0a458"/>
      <stop offset="1" stop-color="#d96b93"/>
    </linearGradient>
    <radialGradient id="ground" cx=".85" cy=".05" r="1">
      <stop offset="0" stop-color="#27414f"/>
      <stop offset="1" stop-color="#12161b"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#ground)"/>
  <path d="M10 7v18M10 16.5 22.5 7M10 16.5 22.5 25.5" fill="none" stroke="url(#aurora)"
        stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
