<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The mark: a K in the aurora colours over the site's cold light ground.
       Teal to amber to rose, bottom-left to top-right, like the lights across
       the top of the front page. A hairline edge keeps it visible on a white
       tab bar. -->
  <defs>
    <linearGradient id="aurora" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1f8f85"/>
      <stop offset=".55" stop-color="#e58f3e"/>
      <stop offset="1" stop-color="#c9527e"/>
    </linearGradient>
    <radialGradient id="ground" cx=".85" cy=".05" r="1">
      <stop offset="0" stop-color="#f7f9fb"/>
      <stop offset="1" stop-color="#e3eaf1"/>
    </radialGradient>
  </defs>
  <rect x=".5" y=".5" width="31" height="31" rx="7" fill="url(#ground)" stroke="#15181d" stroke-opacity=".16"/>
  <path d="M10 7v18M10 16.5 22.5 7M10 16.5 22.5 25.5" fill="none" stroke="url(#aurora)"
        stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
