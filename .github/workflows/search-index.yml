# Rebuild the SPLADE search index.
#
# The document side of SPLADE is a 67M-parameter masked LM, so it cannot run in
# the browser — it runs here instead, and the site ships the sparse vectors it
# produces. Whenever the indexed content changes, this rebuilds and commits
# search/index.json and friends.
#
# Deliberately NOT triggered by changes under search/, so the commit this job
# makes cannot retrigger it. That commit does trigger pages.yml, which is how a
# rebuilt index reaches the site.
name: Rebuild search index

# Runs on any branch: an index that disagrees with the content is worse than
# no index, and a branch that changes a page should carry the matching index
# into its pull request rather than waiting for the merge.
on:
  workflow_dispatch:
  push:
    paths:
      - "publications.html"
      - "projects.html"
      - "cv.html"
      - "knowledge/*/index.html"
      - "content/publications/**"
      - "tools/build_search_index.py"
      - "tools/requirements.txt"
      - ".github/workflows/search-index.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: search-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The CPU wheel is a fraction of the size of the default one, and this
      # job never sees a GPU.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r tools/requirements.txt

      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('tools/build_search_index.py') }}
          restore-keys: hf-

      - name: Build the index
        run: python tools/build_search_index.py --out search

      - name: Verify the client agrees with the reference implementation
        run: python tools/check_search_index.py

      - name: Commit the rebuilt index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search/index.json search/qweights.u16.bin search/vocab.txt search/corpus.json
          if git diff --cached --quiet; then
            echo "Index unchanged."
          else
            git commit -m "Rebuild the SPLADE search index"
            git push
            # A push made with GITHUB_TOKEN deliberately does not trigger other
            # workflows, so pages.yml would not run and the rebuilt index would
            # sit undeployed until the next human push. Ask for it explicitly.
            gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
