    <text x="252" y="72">Bergen</text>
    <text x="356" y="72">jakke</text>
    <text x="460" y="72">rød</text>
    <text x="564" y="72">modell</text>
    <text x="668" y="72">samtykke</text>
    <text x="772" y="72">signert</text>
    <text x="876" y="72">2024</text>
  </g>
  <!-- row labels -->
  <g font-size="17" fill="#15181d" text-anchor="end" font-weight="500">
    <text x="176" y="119">bergen</text>
    <text x="176" y="187">red jacket</text>
    <text x="176" y="255">release form</text>
    <text x="176" y="323">2024</text>
  </g>

  <!-- cells: opacity = similarity -->
  <g>
