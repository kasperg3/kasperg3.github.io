    <g transform="translate(200,224)">
      <rect width="96" height="44" rx="6" fill="#1f6f68" opacity=".05"/>
      <rect x="104" width="96" height="44" rx="6" fill="#1f6f68" opacity=".06"/>
      <rect x="208" width="96" height="44" rx="6" fill="#1f6f68" opacity=".05"/>
      <rect x="312" width="96" height="44" rx="6" fill="#1f6f68" opacity=".38"/>
