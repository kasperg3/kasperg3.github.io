      <rect x="624" width="96" height="44" rx="6" fill="#1f6f68" opacity=".10"/>
      <rect width="96" height="44" rx="6" fill="none" stroke="#b4531f" stroke-width="3"/>
    </g>
    <!-- red jacket -> jakke -->
    <g transform="translate(200,156)">
      <rect width="96" height="44" rx="6" fill="#1f6f68" opacity=".07"/>
      <rect x="104" width="96" height="44" rx="6" fill="#1f6f68" opacity=".66"/>
