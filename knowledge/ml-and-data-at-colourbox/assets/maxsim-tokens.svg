<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1000 566" width="1000" height="566" font-family="Inter, system-ui, sans-serif">
  <text x="0" y="18" font-size="13" font-weight="600" fill="#57616d" letter-spacing="2">QUERY TOKENS  ×  TOKENS ON THE ASSET (OCR'd PAGE + CAPTION)</text>

  <!-- column labels: horizontal, no rotation, so nothing collides -->
