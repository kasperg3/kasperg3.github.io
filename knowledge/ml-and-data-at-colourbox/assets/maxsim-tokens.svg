  <!-- one full-width explainer: nothing to collide with -->
  <g transform="translate(0,372)">
    <rect x="0" y="0" width="920" height="150" rx="13" fill="rgba(31,111,104,.07)" stroke="rgba(31,111,104,.25)"/>
    <text x="22" y="34" font-size="16" fill="#15181d">
      <tspan font-weight="700" fill="#b4531f">Outlined</tspan> = the best asset-side match for that query token.
    </text>
    <text x="22" y="64" font-size="17" font-weight="600" fill="#15181d">
      score = Σ over query tokens of  max over the asset's tokens
    </text>
    <text x="22" y="94" font-size="15" fill="#57616d">
      <tspan font-weight="600" fill="#15181d">max</tspan> keeps a rare clue alive · <tspan font-weight="600" fill="#15181d">Σ</tspan> rewards covering several clues, not one lucky match
    </text>
    <text x="22" y="124" font-size="15" fill="#b4531f" font-weight="500">
      Row 2: the customer typed English, the asset was captioned in Norwegian. Exact match scores zero.
    </text>
