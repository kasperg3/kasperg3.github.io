<!doctype html>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site/site.css">
<link rel="stylesheet" href="/blog/blog.css">
<style>
  html,body{margin:0;padding:0}
  body{width:1200px;height:1200px;overflow:hidden}
  .shot{width:1200px;height:1200px;padding:64px 64px 48px;display:flex;flex-direction:column;
        background:
          radial-gradient(90% 62% at 10% -10%, rgba(63,190,178,.17), transparent 62%),
          radial-gradient(72% 55% at 92% -8%, rgba(240,164,88,.14), transparent 60%),
          var(--canvas)}
  .shot .eyebrow{font:600 16px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
                 color:var(--accent);margin:0;flex:none}
  .shot h1{font:700 60px/1.12 var(--serif);color:var(--ink);margin:22px 0 0;letter-spacing:-.015em;
           max-width:27ch;flex:none}
  .shot .figwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;
                 margin:46px 0 0}
  .shot .panel{background:var(--card);border:1px solid var(--accent);border-radius:18px;
               box-shadow:inset 0 0 0 1px var(--accent);padding:30px 34px 22px;
               width:648px}
  .shot .panel svg{width:100%;height:auto;display:block}
  .shot .panel .badge{margin:14px 0 0;font:600 18px/1.4 var(--mono);color:var(--accent);
                      text-align:center}
  .shot .foot{display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex:none;
        border-top:1px solid var(--hair);padding-top:20px;margin-top:40px;
        font:500 17px/1.4 var(--mono);color:var(--faint)}
  .shot .foot .url{color:var(--accent)}
</style>
